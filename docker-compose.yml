services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    environment:
      APP_ENV: production
      ADDR: ":8080"
      ENV_FILE: /app/.env
      DB_DRIVER: postgres
      DB_DSN: ${DB_DSN:?请设置 DB_DSN（生产环境请使用受 TLS 保护的数据库连接）}
      STORAGE_DRIVER: r2
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET: ${R2_BUCKET:-site-images}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?请设置 ADMIN_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?请设置 JWT_SECRET}
      IMG_SIZES: ${IMG_SIZES:-400,800,1200,1600}
      IMG_FORMATS: ${IMG_FORMATS:-webp}
      IMG_QUALITY: ${IMG_QUALITY:-82}
      IMG_KEEP_ORIGINAL: ${IMG_KEEP_ORIGINAL:-true}
      UPLOAD_MAX_MB: ${UPLOAD_MAX_MB:-20}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-180}
      AUTO_RESTART: ${AUTO_RESTART:-true}
      AI_IMAGE_API_URL: ${AI_IMAGE_API_URL:-https://api.openai.com/v1/images/generations}
      AI_IMAGE_API_KEY: ${AI_IMAGE_API_KEY:-}
      AI_IMAGE_MODEL: ${AI_IMAGE_MODEL:-gpt-image-1}
      AI_IMAGE_ALLOWED_HOSTS: ${AI_IMAGE_ALLOWED_HOSTS:-api.openai.com}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-r2admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请设置 POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-r2admin}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U r2admin"]
      interval: 5s
      timeout: 5s
      retries: 12

  # 如需 MySQL，注释上面的 db 服务，启用下面这段，并把 app 的 DB_DSN 改为：
  # root:r2admin@tcp(db:3306)/r2admin?charset=utf8mb4&parseTime=True&loc=Local
  # db:
  #   image: mysql:8.4
  #   restart: unless-stopped
  #   environment:
  #     MYSQL_ROOT_PASSWORD: r2admin
  #     MYSQL_DATABASE: r2admin
  #   volumes:
  #     - mysqldata:/var/lib/mysql
  #   healthcheck:
  #     test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
  #     interval: 5s
  #     timeout: 5s
  #     retries: 12

volumes:
  pgdata:
  # mysqldata:
